<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Launcher</title>
    <style>
        body {
            background-color: #8b956d; /* Classic Game Boy green-ish tint */
            color: #0f380f;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .screen {
            border: 4px solid #0f380f;
            padding: 20px;
            width: 80%;
            text-align: center;
            background: #9bbc0f;
            box-shadow: inset 0 0 10px #306230;
        }
        h1 { font-size: 20px; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { padding: 5px 0; font-size: 16px; }
        li.selected { background-color: #306230; color: #9bbc0f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="screen">
        <h1>GAME BOY OS</h1>
        <ul id="menu">
            <li class="selected">▶ Phone</li>
            <li>▶ Messages</li>
            <li>▶ Settings</li>
        </ul>
    </div>

    <script>
        let currentIndex = 0;
        const items = document.querySelectorAll("#menu li");

        function updateSelection() {
            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add("selected");
                    item.textContent = "▶ " + item.textContent.replace("▶ ", "");
                } else {
                    item.classList.remove("selected");
                    item.textContent = "  " + item.textContent.replace("▶ ", "");
                }
            });
        }

        // This function is triggered by your Java code when physical keys are pressed!
        window.handlePhysicalKey = function(key) {
            if (key === "UP") {
                currentIndex = (currentIndex - 1 + items.length) % items.length;
                updateSelection();
            } else if (key === "DOWN") {
                currentIndex = (currentIndex + 1) % items.length;
                updateSelection();
            } else if (key === "A") {
                alert("Selected: " + items[currentIndex].textContent.replace("▶ ", ""));
            }
        };
    </script>
</body>
</html>
